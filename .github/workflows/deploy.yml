name: Deploy site

on:
  schedule:
    # KST 05:33.  This is a safety-net publish before the 08:00 KST
    # freshness deadline when the daily pipeline's Pages API call was
    # temporarily unavailable after the data commit.
    - cron: "33 20 * * *"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: site/package.json

      - name: Install site deps
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build site
        working-directory: site
        env:
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
        run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - name: Deploy to Pages
        # The artifact service can lag the upload by a few seconds. Retry the
        # deployment once so a transient lookup failure does not leave the
        # newest daily data off the public site.
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Retry Pages deployment after artifact propagation
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to Pages (retry)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
